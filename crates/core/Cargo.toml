# NIKHIL//OS shared core.
#
# A Unix-inspired simulated operating system, compiled to:
#   - native code  (headless operation + tests, future Tauri desktop)
#   - WebAssembly  (Web Edition, via the `wasm` feature + wasm-bindgen)
#
# The core has zero UI dependencies and runs without any UI framework.

[package]
name = "nikhil-os-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared NIKHIL//OS runtime: a Unix-inspired simulated operating system."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { workspace = true, optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen"]
