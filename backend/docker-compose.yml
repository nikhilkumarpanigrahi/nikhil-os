# NIKHIL//OS backend — one box, three services, $0/month on the AWS free tier.
#
#   docker compose up -d --build
#
# Reads config/secrets from .env (see .env.example). DATABASE_URL inside the
# api container is computed from POSTGRES_* — do not set it in .env.
#
# Free-tier sizing (t2.micro, 1 GB RAM): Postgres is capped at 512 MB with a
# small buffer cache, the API at 384 MB, Caddy at 128 MB, plus ~1 GB swap from
# scripts/provision.sh. `depends_on: service_healthy` orders startup.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nikhilos}
      POSTGRES_USER: ${POSTGRES_USER:-nikhilos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-nikhilos} -d $${POSTGRES_DB:-nikhilos}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build:
      # Context is the repo root (not .): the image embeds the canonical
      # knowledge/data/profile.json, which lives one level up from backend/.
      context: ..
      dockerfile: backend/Dockerfile
      # LTO off = the image builds comfortably on a 1 GB free-tier box.
      args:
        LTO: "off"
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides any DATABASE_URL in .env — the API only talks to the compose db.
      DATABASE_URL: postgres://${POSTGRES_USER:-nikhilos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nikhilos}
      LOG_FORMAT: json
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 384M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN required in .env (e.g. api.nikhil.is-a.dev)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  pgdata:
  caddy_data:
  caddy_config:
