[package]
name = "nikhil-os-backend"
version = "0.1.0"
edition = "2021"
description = "NIKHIL//OS backend — contact inbox, admin API, and live knowledge service (axum + PostgreSQL)"
license = "MIT"
repository = "https://github.com/nikhilkumarpanigrahi/nikhil-os"

# Standalone workspace: the backend has its own lockfile so the WASM core build
# in crates/core stays independent and fast.
[workspace]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate", "ipnetwork"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "limit", "catch-panic"] }
tower = "0.5"
http = "1"
governor = "0.8"
argon2 = "0.5"
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
dotenvy = "0.15"
thiserror = "2"
async-trait = "0.1"

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
lto = true
strip = true
