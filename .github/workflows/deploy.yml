name: Deploy Web Edition

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.15.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build WASM core
        run: wasm-pack build --target bundler --out-dir ../../web/pkg -- --features wasm
        working-directory: crates/core
      - name: Install + build web
        run: npm ci && npm run build
        working-directory: web
        env:
          # Live backend origin for the Contact app. Set the repository secret
          # VITE_API_URL=https://api.nikhil.is-a.dev to activate live contact;
          # unset, the app stays offline-first (mailto fallback) by design.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
