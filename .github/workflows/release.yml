name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Web edition is released continuously via the Pages deploy workflow.
  # This job reserves the tag → changelog release flow for future desktop
  # (Tauri) and kernel releases.
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate release notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
