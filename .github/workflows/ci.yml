name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      # Pin wasm-pack: v0.14 removed `--features` from `build`; latest-vs-stable
      # would otherwise break this workflow when upstream releases. Cargo args
      # go after `--` (works on every version).
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "0.15.0"
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit + integration tests
        run: cargo test
      - name: WASM build
        run: wasm-pack build --target bundler --out-dir ../../web/pkg -- --features wasm
        working-directory: crates/core

  web:
    name: Web edition
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "0.15.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      # web/pkg is gitignored (rebuilt on demand), but the web build imports it.
      - name: Build WASM core
        run: wasm-pack build --target bundler --out-dir ../../web/pkg -- --features wasm
        working-directory: crates/core
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Type check + lint
        run: npm run lint && npm run typecheck
        working-directory: web
      - name: Tests
        run: npm test -- --run
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
      # GitHub Pages serves the site from a subpath (/nikhil-os/). Vite's
      # `base: "./"` emits relative asset URLs; an absolute one (e.g. /assets/...)
      # 404s there and the app renders a white screen. Fail the build if any ever
      # sneaks back in — this is a permanent guard, not a postmortem.
      - name: "Guard: asset paths must be relative (subpath-safe)"
        run: >-
          node -e "const h=require('fs').readFileSync('dist/index.html','utf8');
          const bad=[...h.matchAll(/(?:src|href)=\"\\/(?!\\/)/g)];
          if(bad.length){console.error('Absolute asset path(s) in dist/index.html:',bad.map(m=>m[0]));process.exit(1)}
          console.log('OK: all asset paths are relative')"
        working-directory: web
